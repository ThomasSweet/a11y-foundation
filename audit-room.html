<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />

    <!-- Lock the @layer order before any bundled CSS parses (see index.html). -->
    <style>
      @layer reset, tokens, themes, base, layout, components, utilities, preferences;
      /* Pre-CSS ground so a raw frame in the view-transition handoff paints
         desk-colored, not UA-white. The literal mirrors --color-bg-subtle
         (tokens.css); once the bundle loads, var(--bp-ground) takes over and
         the canvas re-inks per theme. */
      @layer base {
        :root {
          --boot-ground: light-dark(#f5f5f5, #1a1a1a);
        }

        html {
          background-color: var(--bp-ground, var(--boot-ground));
        }
      }
    </style>

    <!-- View-transition opt-in, inline: it must be in BOTH documents' static
         CSSOM at navigation time (bundled CSS arrives too late in dev). -->
    <style>
      @media (prefers-reduced-motion: no-preference) {
        @view-transition {
          navigation: auto;
        }

        ::view-transition {
          background-color: var(--bp-ground, var(--boot-ground));
        }
      }
    </style>

    <!-- Apply the saved theme before first paint. Must stay in sync with ThemeToggle. -->
    <script>
      try {
        var savedTheme = localStorage.getItem('abd-theme')
        if (savedTheme === 'light' || savedTheme === 'dark') {
          document.documentElement.dataset.theme = savedTheme
        } else if (/^(ocean|midnight|sunset|cobalt|teal|amber|contrast-light|contrast-dark)$/.test(savedTheme)) {
          document.documentElement.dataset.preset = savedTheme
        }
      } catch (e) {}
    </script>

    <title>The audit room — Accessible by default</title>
    <link rel="canonical" href="https://accessible-by-default.dev/audit-room.html" />
    <meta
      name="description"
      content="A page broken on purpose: twelve accessibility barriers hidden in a fictional band page. Hunt them with the tools this site taught — heading list, tab key, accessibility tree — answers included."
    />

    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />

    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f5f5f5" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#1a1a1a" />
  </head>
  <body>
    <div id="app"></div>
    <script type="module" blocking="render" src="/src/entries/audit-room.ts"></script>
  </body>
</html>
