name: Baseline moves

on:
  schedule:
    - cron: '30 9 * * 1'
  workflow_dispatch:

concurrency:
  group: baseline-moves
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  propose:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Update web-features
        run: npm install web-features@latest --save-dev --save-exact

      - name: Regenerate Baseline data
        run: node scripts/gen-baseline.mjs

      - name: Regenerate the agent skill and llms mirror
        run: node scripts/gen-skill.mjs

      - name: Propose what-changed lines
        run: node scripts/gen-moves.mjs | tee moves.md

      - name: Did anything move
        id: moves
        run: |
          if grep -q 'nothing moved' moves.md; then
            echo 'moved=false' >> "$GITHUB_OUTPUT"
          else
            echo 'moved=true' >> "$GITHUB_OUTPUT"
          fi

      - name: Regenerate the feed
        run: node scripts/gen-feed.mjs

      - name: Open a pull request
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.BOT_TOKEN || github.token }}
          branch: chore/baseline-moves
          delete-branch: true
          commit-message: "${{ steps.moves.outputs.moved == 'true' && 'chore: Baseline moved, what-changed lines proposed' || 'chore: web-features bumped, nothing moved' }}"
          title: "${{ steps.moves.outputs.moved == 'true' && 'chore: Baseline moved, what-changed lines proposed' || 'chore: web-features bumped, nothing moved' }}"
          body-path: moves.md
          labels: baseline
          add-paths: |
            package.json
            package-lock.json
            src/showcases/baseline-data.json
            skills/accessible-by-default/references
            public/llms
            src/site/HubRevisions/revisions.ts
            public/feed.xml
