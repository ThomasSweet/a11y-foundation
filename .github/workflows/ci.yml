name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel superseded runs on the same branch/PR.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Each gate runs as its own step so a failure points at the exact check.
      - name: Type-check
        run: npm run typecheck

      - name: Lint styles
        run: npm run lint:css

      - name: Lint scripts
        run: npm run lint:js

      # Informational: prints which tracked features are newly available (so we
      # notice), without failing — the gate is the baseline unit test below.
      - name: Baseline report
        run: npm run baseline:check || true

      # Pure-logic suite, see GUIDE.md.
      - name: Unit tests
        run: npm run test:unit

      - name: Build
        run: npm run build

      - name: Generated files are committed
        run: |
          npm run skill:gen
          git diff --exit-code -- skills public/llms public/feed.xml src/showcases/baseline-data.json

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Cache the browser binaries across runs (keyed on the Playwright version
      # pinned in the lockfile).
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      # axe sweep + keyboard/focus behaviour across Chromium, Firefox, WebKit.
      # Playwright builds and serves the app itself (see playwright.config.ts).
      - name: e2e tests
        run: npm run test:e2e

      - name: Upload Playwright report
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
