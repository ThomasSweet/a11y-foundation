name: Design feedback
description: Something about the look, the flow, or the motion that could land better. One line is plenty.
title: "[design]: "
labels: ["design-feedback"]
body:
  - type: dropdown
    id: area
    attributes:
      label: What is it about?
      options:
        - Readability
        - Flow and structure
        - Look and feel
        - Motion
        - Something else (say what below)
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What did you notice?
      description: Where it was, what happened, and what would have landed better.
    validations:
      required: true
  - type: dropdown
    id: mode
    attributes:
      label: Color scheme you viewed in
      options:
        - Light
        - Dark
        - Both
  - type: input
    id: env
    attributes:
      label: Browser / OS
      placeholder: e.g. Firefox 143 on Windows 11
