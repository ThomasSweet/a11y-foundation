<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Correct-scheme first paint before any CSS parses (no white flash in dark mode). -->
    <meta name="color-scheme" content="light dark" />

    <!-- Lock the @layer order before any bundled CSS parses. In the production
         build Vite emits component styles in a separate file that can load
         before the global order declaration, which would otherwise register
         `components` as the lowest-priority layer and invert the cascade. -->
    <style>
      @layer reset, tokens, themes, base, layout, components, utilities, preferences;
      /* Pre-CSS ground so a raw frame in the view-transition handoff paints
         desk-colored, not UA-white. The literal mirrors --color-bg-subtle
         (tokens.css); once the bundle loads, var(--bp-ground) takes over and
         the canvas re-inks per theme. */
      @layer base {
        :root {
          --boot-ground: light-dark(#f5f5f5, #1a1a1a);
        }

        html {
          background-color: var(--bp-ground, var(--boot-ground));
        }
      }
    </style>

    <!-- View-transition opt-in, inline: it must be in BOTH documents' static
         CSSOM at navigation time (bundled CSS arrives too late in dev). -->
    <style>
      @media (prefers-reduced-motion: no-preference) {
        @view-transition {
          navigation: auto;
        }

        ::view-transition {
          background-color: var(--bp-ground, var(--boot-ground));
        }
      }
    </style>

    <!-- Apply the saved theme before first paint so a reload never flashes
         the default palette. Must stay in sync with ThemeToggle. -->
    <script>
      try {
        var savedTheme = localStorage.getItem('abd-theme')
        if (savedTheme === 'light' || savedTheme === 'dark') {
          document.documentElement.dataset.theme = savedTheme
        } else if (/^(ocean|midnight|sunset|cobalt|teal|amber|contrast-light|contrast-dark)$/.test(savedTheme)) {
          document.documentElement.dataset.preset = savedTheme
        }
      } catch (e) {}
    </script>

    <!-- The one-page era's anchors live on their chapter pages now; forward
         inbound deep links there (hash preserved) instead of dropping them. -->
    <script>
      ;(function () {
        var h = location.hash
        if (!h) return
        var map = [
          [/^#(standard|demo-criteria|demo-conformance|demo-legal)/, '/standard.html'],
          [/^#craft/, '/craft.html'],
          [/^#(showcase|tier-)/, '/showcase.html'],
          [/^#testing/, '/proof.html'],
        ]
        for (var i = 0; i < map.length; i++) {
          if (map[i][0].test(h)) {
            location.replace(map[i][1] + h)
            return
          }
        }
      })()
    </script>

    <title>Accessible by default — an accessibility-first styling playground</title>
    <meta
      name="description"
      content="An accessibility-first styling foundation — a playground showing how modern CSS and the web platform handle accessibility natively, with little to no JavaScript."
    />

    <!-- Icons: SVG for modern browsers (sharp at any size), PNG fallbacks. -->
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />

    <!-- Browser chrome colour follows the site's light/dark surfaces. -->
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#ffffff" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0f0f0f" />
