<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <style>
      @layer reset, tokens, themes, base, layout, components, utilities, preferences;

      @layer base {
        :root {
          --boot-ground: light-dark(#f5f5f5, #1a1a1a);
        }

        html {
          background-color: var(--bp-ground, var(--boot-ground));
        }
      }
    </style>
    <style>
      @layer base {
        @media (prefers-reduced-motion: no-preference) {
          @view-transition {
            navigation: auto;
            types: page;
          }

          :root:active-view-transition-type(page) {
            view-transition-name: none;
          }

          :root:active-view-transition-type(page)::view-transition {
            animation: 0.5s site-content-wait;
          }

          :root:active-view-transition-type(page) body {
            visibility: hidden;
          }

          @keyframes site-content-wait {
            to {
              opacity: 1;
            }
          }
        }
      }
    </style>
    <script>
      try {
        var savedTheme = localStorage.getItem('abd-theme')
        if (savedTheme === 'light' || savedTheme === 'dark') {
          document.documentElement.dataset.theme = savedTheme
        } else if (/^(ocean|midnight|sunset|cobalt|teal|amber|contrast-light|contrast-dark)$/.test(savedTheme)) {
          document.documentElement.dataset.preset = savedTheme
        }
      } catch (e) {}
    </script>

    <title>Checks package — Accessible by default</title>
    <link rel="canonical" href="https://accessible-by-default.dev/checks/" />
    <meta
      name="description"
      content="An npm package of Playwright matchers that operate a page's widgets by keyboard in Chromium, Firefox and WebKit and check that they behave as they claim: expanded state, modal focus, and errors tied to their fields."
    />

    <link rel="icon" href="/icon-192.png" type="image/png" sizes="192x192" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <link rel="alternate" type="application/atom+xml" title="Accessible by default: what changed" href="/feed.xml" />

    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f5f5f5" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#1a1a1a" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Accessible by default" />
    <meta property="og:url" content="https://accessible-by-default.dev/checks/" />
    <meta property="og:title" content="Checks package" />
    <meta property="og:description" content="An npm package of Playwright matchers that operate a page's widgets by keyboard in Chromium, Firefox and WebKit and check that they behave as they claim: expanded state, modal focus, and errors tied to their fields." />
    <meta property="og:image" content="https://accessible-by-default.dev/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="The a11y mark and the words Accessible by default on a drafting sheet, with the line: how much of accessibility the web platform handles natively, with little to no JavaScript." />
    <meta name="twitter:card" content="summary_large_image" />
  </head>
  <body>
    <div id="app"></div>
    <script type="module" blocking="render" src="/src/entries/checks.ts"></script>
  </body>
</html>
