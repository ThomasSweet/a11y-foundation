<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 190" width="1080" height="190">
  <!-- The README's thesis, practising the thesis: colors follow
       prefers-color-scheme, and the strike only animates when the viewer
       has no reduced-motion preference (motion is the enhancement). -->
  <style>
    .bg { fill: #ffffff; }
    .grid { stroke: rgba(37, 99, 235, 0.09); stroke-width: 1; }
    .reg { stroke: #2563eb; stroke-width: 2; fill: none; }
    .eyebrow { fill: #2563eb; font: 600 14px ui-monospace, "SF Mono", Menlo, Consolas, monospace; letter-spacing: 3px; }
    .ink { fill: #111111; font: 800 88px system-ui, -apple-system, "Segoe UI", sans-serif; letter-spacing: -1.2px; }
    .strike { fill: #111111; transform-box: fill-box; transform-origin: left center; }

    @media (prefers-color-scheme: dark) {
      .bg { fill: #1e1e1e; }
      .grid { stroke: rgba(59, 130, 246, 0.12); }
      .reg { stroke: #3b82f6; }
      .eyebrow { fill: #3b82f6; }
      .ink { fill: #f0f0f0; }
      .strike { fill: #f0f0f0; }
    }

    /* Replays 3 times (~25s) then settles struck — finite, so it needs no
       pause control (WCAG 2.2.2); an image couldn't offer one. Note: no
       angle brackets in this style element, ever — in XML they are markup
       and silently truncate the stylesheet. `backwards` holds the undrawn
       0% state through the delay; after the last cycle the element returns
       to its base (struck) state. */
    @media (prefers-reduced-motion: no-preference) {
      .strike {
        animation: strike-cycle 8s cubic-bezier(0.4, 0, 0.2, 1) 0.9s 3 backwards;
      }

      @keyframes strike-cycle {
        0% { transform: scaleX(0); opacity: 1; }
        10% { transform: scaleX(1); opacity: 1; }
        75% { transform: scaleX(1); opacity: 1; }
        82% { transform: scaleX(1); opacity: 0; }
        83% { transform: scaleX(0); opacity: 0; }
        91% { transform: scaleX(0); opacity: 1; }
        100% { transform: scaleX(0); opacity: 1; }
      }
    }
  </style>

  <rect class="bg" width="1080" height="190" />

  <defs>
    <pattern id="sheet-grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path class="grid" d="M28 0H0V28" fill="none" />
    </pattern>
  </defs>
  <rect width="1080" height="190" fill="url(#sheet-grid)" />

  <!-- corner registration marks -->
  <path class="reg" d="M6 22V6h16" />
  <path class="reg" d="M1058 6h16v16" />
  <path class="reg" d="M22 184H6v-16" />
  <path class="reg" d="M1074 168v16h-16" />

  <text class="eyebrow" x="64" y="54">ACCESSIBLE BY DEFAULT · DRAWING 00</text>

  <!-- textLength matches the measured natural width (macOS system-ui 800/88px),
       and lengthAdjust="spacing" keeps glyph shapes intact on platforms whose
       fonts run wider/narrower — only the spacing flexes, never the letters. -->
  <text class="ink" x="62" y="142" textLength="433" lengthAdjust="spacing">Built in, not</text>
  <text class="ink" x="522" y="142" textLength="374" lengthAdjust="spacing">bolted on</text>
  <rect class="strike" x="514" y="110" width="390" height="11" />
</svg>
